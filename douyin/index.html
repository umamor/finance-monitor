<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>账号矩阵数据平台</title>
<style>
:root{--bg:#F7F4EE;--card:#FFFFFF;--ink:#26221C;--ink2:#5B564D;--mut:#948C7E;--gold:#C9A96E;--gold2:#B08A4A;--red:#D6392F;--green:#1E9E5A;--line:#EDE7DA;}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
body{background:var(--bg);color:var(--ink);font-size:15px;}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.hwrap{max-width:1420px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.logo{font-size:22px;font-weight:900;letter-spacing:1px;}
.logo b{color:var(--gold2);}
.sub{color:var(--mut);font-size:13px;}
.range{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.range input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);font-size:14px;}
.btns{display:flex;gap:6px;}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--ink2);transition:.15s;}
.btn:hover{border-color:var(--gold);color:var(--gold2);}
.btn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;}
nav{max-width:1420px;margin:0 auto;padding:0 24px;display:flex;gap:4px;}
nav .tab{padding:11px 18px;cursor:pointer;color:var(--ink2);font-size:15.5px;border-bottom:3px solid transparent;}
nav .tab.on{color:var(--gold2);border-bottom-color:var(--gold);font-weight:800;}
main{max-width:1420px;margin:0 auto;padding:20px 24px 60px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.kpi .v{font-size:30px;font-weight:900;white-space:nowrap;}
.kpi .l{color:var(--ink2);font-size:14px;margin-top:4px;}
.kpi .s{color:var(--mut);font-size:12px;margin-top:3px;min-height:15px;}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);padding:18px 20px;margin-bottom:18px;}
.card h3{font-size:16px;margin-bottom:10px;color:var(--ink);display:flex;align-items:center;gap:8px;}
.card h3:before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:14px;}
th{color:var(--mut);font-weight:600;font-size:13px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;}
th.l,td.l{text-align:left;}
tr:hover td{background:#FBF8F2;}
.up{color:var(--red);font-weight:700}.down{color:var(--green);font-weight:700}
.tot td{background:#FBF7EF;font-weight:700}
.mut{color:var(--mut)}
/* ---- 账号卡片（头像·可点击·增长） ---- */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px;margin-bottom:16px;}
.acard{background:#fff;border-radius:14px;padding:16px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;position:relative;transition:.15s;border:1px solid transparent;min-width:0;}
.acard:hover{border-color:var(--gold);transform:translateY(-1px);}
.acard .top{display:flex;gap:10px;align-items:center;min-width:0;}
.ava{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#EFE9DC;flex:none;color:#8C7B57;font-weight:800;}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ava.s44{width:44px;height:44px;font-size:17px;}
.ava.s32{width:32px;height:32px;font-size:13px;}
.ava.s28{width:28px;height:28px;font-size:12px;}
.acard .nm{font-weight:800;font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.acard .sub{color:var(--mut);font-size:13px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.acard .nums{display:flex;justify-content:space-between;align-items:flex-end;margin-top:11px;gap:8px;min-width:0;}
.acard .fans{min-width:0;}
.acard .fans b{font-size:21px;white-space:nowrap;}
.acard .fans .lbl{color:var(--mut);font-size:13px;margin-right:4px;}
.acard .d{font-size:13px;margin-top:3px;}
.acard .lk{position:absolute;top:10px;right:12px;color:#C9C1B0;text-decoration:none;font-size:16px;}
.acard .lk:hover{color:var(--gold2);}
.spark{width:118px;height:34px;display:block;}
.namecell{display:inline-flex;align-items:center;gap:8px;min-width:0;}
.twrap{overflow-x:auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
#ovChart{width:100%;height:320px;}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filters select,.filters input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;background:#fff;color:var(--ink);}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#F4EFE4;color:var(--ink2);font-size:12.5px;}
.tag.dy{background:#FFF0EE;color:#C0392B}.tag.sph{background:#EAF6EC;color:#1E7A43}
.tag.xhs{background:#FDECEC;color:#B03A3A}.tag.ks{background:#FFF6E5;color:#A66A00}.tag.tt{background:#EEF0F4;color:#556}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut);font-size:13px;}
.drawer{position:fixed;top:0;right:-760px;width:740px;max-width:96vw;height:100vh;background:var(--bg);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:60;transition:right .25s;overflow-y:auto;}
.drawer.open{right:0;}
.drawer .dhead{position:sticky;top:0;background:#fff;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2;}
.drawer .dhead .x{margin-left:auto;cursor:pointer;font-size:20px;color:var(--mut);border:none;background:none;}
.dbody{padding:18px 22px 40px;}
.minikpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.yt-card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.nodata{color:var(--mut);text-align:center;padding:40px;font-size:14px;}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <div class="logo">账号矩阵 <b>数据平台</b></div>
      <div class="sub" id="subline">加载中…</div>
    </div>
    <div class="range">
      <input type="date" id="dFrom"> <span class="mut">~</span> <input type="date" id="dTo">
      <div class="btns" id="presets">
        <button class="btn" data-d="7">7日</button>
        <button class="btn on" data-d="15">15日</button>
        <button class="btn" data-d="30">30日</button>
        <button class="btn" data-d="90">90日</button>
        <button class="btn" data-d="0">全部</button>
      </div>
    </div>
  </div>
  <nav id="tabs">
    <div class="tab on" data-tab="overview">数据总览</div>
    <div class="tab" data-tab="accounts">账号矩阵</div>
    <div class="tab" data-tab="videos">视频库</div>
    <div class="tab" data-tab="yt">海外 YouTube</div>
  </nav>
</header>
<main>
  <!-- ============ 总览 ============ -->
  <section id="tab-overview">
    <div class="kpis" id="kpis"></div>
    <div class="grid3">
      <div class="card"><h3>每日发布与播放 <span class="mut" id="chartRange" style="font-weight:400;font-size:13px"></span></h3><div id="ovChart"></div></div>
      <div class="card"><h3>平台概览</h3><table id="platTbl"></table></div>
    </div>
    <div class="card"><h3>分发矩阵 · IP × 平台（格内 = 窗口发布条数）</h3><table id="matrixTbl"></table><div class="mut" style="font-size:12.5px;margin-top:6px">红字 = 有更新；○ = 有号但窗口内零更新；· = 未开号</div></div>
  </section>

  <!-- ============ 账号 ============ -->
  <section id="tab-accounts" hidden>
    <div class="acards" id="accCards"></div>
    <div class="card">
      <div class="filters">
        <select id="fPlat"><option value="">全部平台</option></select>
        <input type="text" id="fQ" placeholder="搜索账号 / IP…">
        <span class="mut" id="accCount"></span>
      </div>
      <table id="accTbl"></table>
    </div>
  </section>

  <!-- ============ 视频库 ============ -->
  <section id="tab-videos" hidden>
    <div class="card">
      <div class="filters">
        <select id="vPlat"><option value="">全部平台</option></select>
        <select id="vAcc"><option value="">全部账号</option></select>
        <input type="text" id="vQ" placeholder="搜索标题…">
        <select id="vSize"><option value="50">每页 50</option><option value="100">每页 100</option><option value="200">每页 200</option></select>
        <button class="btn" id="vExport">导出 CSV</button>
        <span class="mut" id="vCount"></span>
      </div>
      <table id="vidTbl"></table>
      <div class="pager" id="vPager"></div>
    </div>
  </section>

  <!-- ============ YouTube ============ -->
  <section id="tab-yt" hidden>
    <div class="kpis" id="ytKpis" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="card"><h3>订阅走势</h3><div id="ytChart" style="height:320px"></div></div>
    <div class="card"><h3>频道</h3><table id="ytTbl"></table></div>
  </section>
</main>

<!-- 账号详情抽屉 -->
<div class="drawer" id="drawer">
  <div class="dhead"><b id="drName">—</b><span class="tag" id="drPlat"></span><button class="x" onclick="closeDrawer()">✕</button></div>
  <div class="dbody" id="drBody"></div>
</div>

<script src="echarts.min.js"></script>
<script>
/* ================= 数据加载 ================= */
let ACCOUNTS=[], SERIES={}, VIDEOS={}, YT=null, ALLVIDS=[];
const PLAT_CN={"视频号":"视频号","抖音号":"抖音号","小红书":"小红书","快手号":"快手号","头条号":"头条号"};
const PLAT_CLS={"抖音号":"dy","视频号":"sph","小红书":"xhs","快手号":"ks","头条号":"tt"};
const state={from:"",to:"",tab:"overview",sortA:{k:"fans",d:-1},sortV:{k:"d",d:-1},page:0,pageSize:50,fPlat:"",fQ:"",vPlat:"",vAcc:"",vQ:""};

const $=s=>document.querySelector(s);
const fmt=n=>{if(n==null)return"—";n=Math.round(n);if(Math.abs(n)>=1e8)return(n/1e8).toFixed(2)+"亿";if(Math.abs(n)>=1e4)return(n/1e4).toFixed(1).replace(/\.0$/,"")+"万";return n.toLocaleString();};
const pct=x=>x==null?"—":(x*100).toFixed(1).replace(/\.0$/,"")+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inRange=d=>d && state.from<=d && d<=state.to;

async function boot(){
  const [acc,ser,yt]=await Promise.all([fetch("data/accounts.json").then(r=>r.json()),
    fetch("data/series.json").then(r=>r.json()), fetch("data/yt.json").then(r=>r.json())]);
  ACCOUNTS=acc; SERIES=ser; YT=yt;
  const vs=await Promise.all(ACCOUNTS.map(a=>fetch("data/videos/"+encodeURIComponent(a.key)+".json").then(r=>r.json()).catch(()=>[])));
  ACCOUNTS.forEach((a,i)=>{VIDEOS[a.key]=vs[i];(vs[i]||[]).forEach(v=>{ALLVIDS.push(Object.assign({},v,{acc:a.name,plat:a.platform,key:a.key}));});});
  // 默认范围：数据最大日期前推 14 天
  const days=ALLVIDS.map(v=>v.d).filter(Boolean).sort();
  const maxD=days[days.length-1]||new Date().toISOString().slice(0,10);
  const minD=days[0]||maxD;
  state.maxD=maxD; state.minD=minD;
  setRange(15);
  $("#subline").textContent=`${ACCOUNTS.length} 账号 × ${new Set(ACCOUNTS.map(a=>a.platform)).size} 平台 + 海外 YouTube · 视频 ${ALLVIDS.length.toLocaleString()} 条 · 数据更新 ${maxD}`;
  /* 表格统一包一层横向滚动容器：窄屏只滚表格，页面本身不横滚 */
  document.querySelectorAll("table").forEach(t=>{
    if(t.parentElement && t.parentElement.classList.contains("twrap")) return;
    const w=document.createElement("div"); w.className="twrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
  initUi();
  renderAll();
}

/* ================= 范围 & UI ================= */
function dayAdd(d,n){const t=new Date(d+"T12:00:00");t.setDate(t.getDate()+n);
  const p=x=>String(x).padStart(2,"0");
  return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function setRange(n){
  const to=state.maxD; let from = n? dayAdd(to,-(n-1)) : state.minD;
  if(from<state.minD) from=state.minD;
  state.from=from;state.to=to;
  $("#dFrom").value=from;$("#dTo").value=to;
  document.querySelectorAll("#presets .btn").forEach(b=>b.classList.toggle("on",(+b.dataset.d)===n));
}
function initUi(){
  $("#dFrom").value=state.from;$("#dTo").value=state.to;
  $("#dFrom").onchange=e=>{state.from=e.target.value;renderAll();};
  $("#dTo").onchange=e=>{state.to=e.target.value;renderAll();};
  document.querySelectorAll("#presets .btn").forEach(b=>b.onclick=()=>{setRange(+b.dataset.d);renderAll();});
  document.querySelectorAll("#tabs .tab").forEach(t=>t.onclick=()=>{
    state.tab=t.dataset.tab;
    document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.toggle("on",x===t));
    document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="tab-"+state.tab);
    if(state.tab==="overview") drawOverviewChart(); if(state.tab==="yt") drawYtChart();
  });
  const plats=[...new Set(ACCOUNTS.map(a=>a.platform))];
  plats.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;$("#fPlat").appendChild(o);
    const o2=o.cloneNode(true);$("#vPlat").appendChild(o2);});
  ACCOUNTS.slice().sort((a,b)=>a.name.localeCompare(b.name,"zh")).forEach(a=>{
    const o=document.createElement("option");o.value=a.key;o.textContent=`${a.name}（${a.platform}）`;$("#vAcc").appendChild(o);});
  $("#fPlat").onchange=e=>{state.fPlat=e.target.value;renderAccounts();};
  $("#fQ").oninput=e=>{state.fQ=e.target.value.trim();renderAccounts();};
  $("#vPlat").onchange=e=>{state.vPlat=e.target.value;state.page=0;renderVideos();};
  $("#vAcc").onchange=e=>{state.vAcc=e.target.value;state.page=0;renderVideos();};
  $("#vQ").oninput=e=>{state.vQ=e.target.value.trim();state.page=0;renderVideos();};
  $("#vSize").onchange=e=>{state.pageSize=+e.target.value;state.page=0;renderVideos();};
  $("#vExport").onclick=exportCsv;
}
/* 排序头 */
function thClick(which,k){const s=state[which];s.d=(s.k===k)?-s.d:(-1);s.k=k;if(which==="sortA")renderAccounts();else{state.page=0;renderVideos();}}

/* ================= 聚合 ================= */
function winVideos(accKeys,lo,hi){const L=lo||state.from,H=hi||state.to;const ks=accKeys?new Set(accKeys):null;return ALLVIDS.filter(v=>v.d&&L<=v.d&&v.d<=H&&(!ks||ks.has(v.key)));}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)+1;}
function chg(cur,prev){if(!prev)return"";const r=(cur-prev)/prev*100;const cls=r>=0?"up":"down";return `<span class="${cls}">${r>=0?"+":""}${r.toFixed(1)}%</span>`;}
function aggBy(arr,fn){const o={};arr.forEach(v=>{const k=fn(v);o[k]=(o[k]||0)+1;});return o;}
function sumPlay(vs){return vs.reduce((s,v)=>s+(v.p||0),0);}
function sumEng(vs){return vs.reduce((s,v)=>s+(v.e||0),0);}

/* ================= 总览 ================= */
function fansDelta(a){
  // 优先：视频号官方净增序列（fans_net）；其次：粉丝序列首尾差
  const s=SERIES[a.key]||{}; const days=Object.keys(s).filter(d=>inRange(d)).sort();
  if(!days.length) return null;
  let net=0,hasNet=false;
  days.forEach(d=>{if(s[d].fans_net!=null){net+=s[d].fans_net;hasNet=true;}});
  if(hasNet) return {v:net,note:"官方净增"};
  const f=days.map(d=>s[d].fans).filter(x=>x!=null);
  if(f.length>=2) return {v:f[f.length-1]-f[0],note:"首尾差"};
  return null;
}
function renderOverview(){
  const vs=winVideos();
  const pub=vs.length, play=sumPlay(vs), eng=sumEng(vs);
  const len=diffDays(state.from,state.to);
  const pTo=dayAdd(state.from,-1), pFrom=dayAdd(pTo,-(len-1));
  const pvs=winVideos(null,pFrom,pTo);
  const pPub=pvs.length, pPlay=sumPlay(pvs), pEng=sumEng(pvs);
  const totalFans=ACCOUNTS.reduce((s,a)=>s+(a.fans||0),0);
  let fanSum=0,fanCover=0;
  ACCOUNTS.forEach(a=>{const d=fansDelta(a);if(d){fanSum+=d.v;fanCover++;}});
  $("#kpis").innerHTML=[
    ["v",ACCOUNTS.length,"矩阵账号","5 平台 + 海外"],
    ["v",fmt(totalFans),"总粉丝","快照实测"],
    ["v",pub.toLocaleString(),"窗口发布",`${state.from} 起 ${len} 天 ${chg(pub,pPub)}`],
    ["v",fmt(play),"窗口播放",`较上期 ${chg(play,pPlay)||"—"}`],
    ["v",fmt(eng),"窗口互动",`赞+评+转+藏 ${chg(eng,pEng)}`],
    ["v",(fanSum>=0?"+":"")+fmt(fanSum),"窗口涨粉",`覆盖 ${fanCover}/${ACCOUNTS.length} 号`]
  ].map(([cls,v,l,s])=>`<div class="kpi"><div class="${cls}">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div>`).join("");
  $("#chartRange").textContent=`${state.from} ~ ${state.to}`;
  // 平台表
  const plats={};ACCOUNTS.forEach(a=>{const p=plats[a.platform]||(plats[a.platform]={n:0,fans:0});p.n++;p.fans+=a.fans||0;});
  Object.keys(plats).forEach(p=>{const pv=vs.filter(v=>v.plat===p);plats[p].pub=pv.length;plats[p].play=sumPlay(pv);plats[p].eng=sumEng(pv);});
  const pt=Object.entries(plats).sort((a,b)=>b[1].fans-a[1].fans);
  const tot={n:0,fans:0,pub:0,play:0,eng:0};
  pt.forEach(([p,x])=>{tot.n+=x.n;tot.fans+=x.fans;tot.pub+=x.pub;tot.play+=x.play;tot.eng+=x.eng;});
  const per=x=>x.pub?fmt(Math.round(x.play/x.pub)):"—";
  $("#platTbl").innerHTML=`<tr><th class="l">平台</th><th>账号</th><th>粉丝</th><th>发布</th><th>播放</th><th>互动</th><th>条均</th></tr>`+
    pt.map(([p,x])=>`<tr><td class="l"><span class="tag ${PLAT_CLS[p]||""}">${p}</span></td><td>${x.n}</td><td>${fmt(x.fans)}</td><td>${x.pub}</td><td>${fmt(x.play)}</td><td>${fmt(x.eng)}</td><td>${per(x)}</td></tr>`).join("")+
    `<tr class="tot"><td class="l"><b>合计</b></td><td>${tot.n}</td><td>${fmt(tot.fans)}</td><td>${tot.pub}</td><td>${fmt(tot.play)}</td><td>${fmt(tot.eng)}</td><td>${per(tot)}</td></tr>`;
  if(YT&&YT.channels){const ys=YT.channels.reduce((s,c)=>s+(c.subs||0),0);const yv=YT.channels.reduce((s,c)=>s+(c.views||0),0);
    $("#platTbl").innerHTML+=`<tr><td class="l mut" style="font-size:12.5px;white-space:normal" colspan="7">海外 YouTube：${YT.channels.length} 频道 · 订阅 ${fmt(ys)} · 累计播放 ${fmt(yv)}（独立口径，见「海外」页）</td></tr>`;}
  // 矩阵
  const ips={};ACCOUNTS.forEach(a=>{const ip=ips[a.ip]||(ips[a.ip]={});ip[a.platform]=ip[a.platform]||{n:0,pub:0,fans:0};ip[a.platform].n++;ip[a.platform].fans+=a.fans||0;});
  Object.keys(ips).forEach(ip=>Object.keys(ips[ip]).forEach(p=>{ips[ip][p].pub=vs.filter(v=>v.plat===p&&ACCOUNTS.some(a=>a.ip===ip&&a.platform===p&&a.key===v.key)).length;}));
  const porder=[...new Set(ACCOUNTS.map(a=>a.platform))];
  const ipRows=Object.entries(ips).map(([ip,row])=>{const fans=Object.values(row).reduce((s,x)=>s+x.fans,0);
    const cells=porder.map(p=>{const x=row[p];if(!x)return`<td class="mut2" style="color:#ddd">·</td>`;
      return x.pub?`<td class="up">${x.pub}</td>`:`<td class="mut" style="color:#bbb">○</td>`;}).join("");
    return `<tr><td class="l"><b>${esc(ip)}</b></td>${cells}<td>${fmt(fans)}</td></tr>`;}).sort((a,b)=>0);
  const colTot={};porder.forEach(p=>colTot[p]=0);
  Object.values(ips).forEach(row=>Object.entries(row).forEach(([p,x])=>{colTot[p]+=x.pub||0;}));
  const grandFans=ACCOUNTS.reduce((s,a)=>s+(a.fans||0),0);
  $("#matrixTbl").innerHTML=`<tr><th class="l">IP</th>${porder.map(p=>`<th>${p}</th>`).join("")}<th>粉丝合计</th></tr>`+ipRows.join("")+
    `<tr class="tot"><td class="l"><b>合计</b></td>${porder.map(p=>`<td>${colTot[p]||"—"}</td>`).join("")}<td>${fmt(grandFans)}</td></tr>`;
  drawOverviewChart();
}
let ovChart=null;
function drawOverviewChart(){
  if(!window.echarts) return;
  const vs=winVideos(); const byDay={};
  let d=state.from; const end=state.to; let guard=0;
  while(d<=end&&guard++<4000){byDay[d]={pub:0,play:0};d=dayAdd(d,1);}
  vs.forEach(v=>{if(byDay[v.d]){byDay[v.d].pub++;byDay[v.d].play+=v.p||0;}});
  const days=Object.keys(byDay);
  if(!ovChart){ovChart=echarts.init($("#ovChart"));}
  ovChart.setOption({
    tooltip:{trigger:"axis"},
    legend:{data:["发布条数","播放量"],right:10,textStyle:{color:"#5B564D"}},
    grid:{left:50,right:56,top:40,bottom:30},
    xAxis:{type:"category",data:days.map(x=>x.slice(5)),axisLabel:{color:"#948C7E",interval:Math.max(0,Math.floor(days.length/12))},axisLine:{lineStyle:{color:"#EDE7DA"}}},
    yAxis:[{type:"value",name:"条",minInterval:1,axisLabel:{color:"#948C7E"},splitLine:{lineStyle:{color:"#F3EEE3"}}},
           {type:"value",name:"播放",axisLabel:{color:"#948C7E",formatter:v=>fmt(v)},splitLine:{show:false}}],
    series:[{name:"发布条数",type:"bar",data:days.map(x=>byDay[x].pub),itemStyle:{color:"#C9A96E",borderRadius:[3,3,0,0]},barMaxWidth:26},
            {name:"播放量",type:"line",yAxisIndex:1,data:days.map(x=>byDay[x].play),smooth:true,itemStyle:{color:"#D6392F"},lineStyle:{width:2.4},symbolSize:5}]
  },true);
  ovChart.resize();
}

/* ================= 账号表 ================= */
function avatarHTML(a,size){const t=((a.name||"?").replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"").slice(0,1))||"?";return `<span class="ava s${size||32}">${a.avatar?`<img src="${esc(a.avatar)}" loading="lazy" onerror="this.remove()">`:""}<span>${esc(t)}</span></span>`;}
function sparkline(key){
  const s=SERIES[key]||{};
  const days=Object.keys(s).filter(d=>s[d].fans!=null&&d<=state.to).sort().slice(-30);
  if(days.length<2)return "";
  const vals=days.map(d=>s[d].fans);
  const min=Math.min(...vals),max=Math.max(...vals),w=104,h=30,pad=3;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), h-pad-((v-min)/((max-min)||1))*(h-2*pad)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#C9A96E" stroke-width="1.8"/></svg>`;
}
function renderCards(byKey,rows){
  const el=$("#accCards");
  const cardRows=(rows||[]).slice().sort((a,b)=>(b.fans||0)-(a.fans||0));
  el.innerHTML=cardRows.map(a=>{
    const vv=(byKey[a.key]||[]);
    const pub=vv.length, play=sumPlay(vv);
    const fd=fansDelta(a);
    const dTxt=fd?(fd.v>=0?`<span class="up">↑ ${fmt(fd.v)}</span>`:`<span class="down">↓ ${fmt(-fd.v)}</span>`)+` <span class="mut">${fd.note}</span>`:'<span class="mut">涨粉 —</span>';
    return `<div class="acard" onclick="openDrawer('${a.key}')">
      ${a.link?`<a class="lk" href="${esc(a.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="打开主页">↗</a>`:""}
      <div class="top">${avatarHTML(a,44)}
        <div style="min-width:0"><div class="nm">${esc(a.name)}</div>
        <div class="sub">${esc(a.ip)} · ${a.platform}</div></div></div>
      <div class="nums">
        <div class="fans"><div><span class="lbl">粉丝</span><b>${fmt(a.fans)}</b></div>
          <div class="d">${dTxt}</div></div>
        ${sparkline(a.key)}
      </div>
      <div class="sub" style="margin-top:6px">窗口发布 ${pub} · 播放 ${fmt(play)}</div>
    </div>`;}).join("")||'<div class="nodata">无匹配账号</div>';
}
function renderAccounts(){
  const vs=winVideos();
  const byKey={};vs.forEach(v=>{(byKey[v.key]=byKey[v.key]||[]).push(v);});
  let rows=ACCOUNTS.filter(a=>(!state.fPlat||a.platform===state.fPlat)&&
    (!state.fQ||(a.name+a.ip).toLowerCase().includes(state.fQ.toLowerCase())));
  const metric=a=>{const vv=byKey[a.key]||[];return{pub:vv.length,play:sumPlay(vv),eng:sumEng(vv),fans:a.fans||0,latest:a.latest||""};};
  const s=state.sortA;
  rows.sort((a,b)=>{const A=metric(a),B=metric(b);let x,y;
    if(s.k==="name"){x=a.name;y=b.name;return s.d*(x<y?-1:1);}
    x=(A[s.k]??A.fans);y=(B[s.k]??B.fans);return s.d*(x-y);});
  $("#accCount").textContent=`共 ${rows.length} 个账号`;
  const arrow=k=>state.sortA.k===k?(state.sortA.d<0?" ↓":" ↑"):"";
  $("#accTbl").innerHTML=`<tr>
    <th class="l" onclick="thClick('sortA','name')">账号${arrow("name")}</th><th>平台</th><th>IP</th>
    <th onclick="thClick('sortA','fans')">粉丝${arrow("fans")}</th>
    <th onclick="thClick('sortA','pub')">窗口发布${arrow("pub")}</th>
    <th onclick="thClick('sortA','play')">窗口播放${arrow("play")}</th>
    <th onclick="thClick('sortA','eng')">窗口互动${arrow("eng")}</th>
    <th>最近更新</th></tr>`+
    rows.map(a=>{const m=metric(a);return `<tr style="cursor:pointer" onclick="openDrawer('${a.key}')">
      <td class="l"><span class="namecell">${avatarHTML(a,28)}<b>${esc(a.name)}</b></span></td><td><span class="tag ${PLAT_CLS[a.platform]||""}">${a.platform}</span></td>
      <td class="mut">${esc(a.ip)}</td><td>${fmt(a.fans)}</td><td>${m.pub}</td><td>${fmt(m.play)}</td><td>${fmt(m.eng)}</td>
      <td class="mut">${m.latest||"—"}</td></tr>`;}).join("");
  renderCards(byKey,rows);
}

/* ================= 视频库 ================= */
function filteredVids(){
  return ALLVIDS.filter(v=>inRange(v.d)&&(!state.vPlat||v.plat===state.vPlat)&&(!state.vAcc||v.key===state.vAcc)
    &&(!state.vQ||(v.t||"").toLowerCase().includes(state.vQ.toLowerCase())));
}
function renderVideos(){
  const vs=filteredVids();
  const s=state.sortV;
  vs.sort((a,b)=>{let x=a[s.k],y=b[s.k];
    if(s.k==="t"){x=x||"";y=y||"";return s.d*(x<y?-1:1);}
    if(s.k==="d"){return s.d*((x||"")<(y||"")?-1:1);}
    x=x==null?-1:x;y=y==null?-1:y;return s.d*(x-y);});
  const total=vs.length,pages=Math.max(1,Math.ceil(total/state.pageSize));
  state.page=Math.min(state.page,pages-1);
  const page=vs.slice(state.page*state.pageSize,(state.page+1)*state.pageSize);
  $("#vCount").textContent=`已筛选 ${total.toLocaleString()} / 全部 ${ALLVIDS.length.toLocaleString()} 条`;
  const arrow=k=>state.sortV.k===k?(state.sortV.d<0?" ↓":" ↑"):"";
  $("#vidTbl").innerHTML=`<tr>
    <th class="l" onclick="thClick('sortV','t')">标题${arrow("t")}</th><th onclick="thClick('sortV','d')">日期${arrow("d")}</th>
    <th>平台</th><th>账号</th>
    <th onclick="thClick('sortV','p')">播放${arrow("p")}</th><th onclick="thClick('sortV','e')">互动${arrow("e")}</th>
    <th>完播</th><th>5s完播</th><th>2s跳出</th><th>封面点击</th><th>均看(s)</th><th>涨粉</th></tr>`+
    page.map(v=>{const m=v.m||{};return `<tr>
      <td class="l" style="max-width:420px;overflow:hidden;text-overflow:ellipsis" title="${esc(v.t)}">${esc((v.t||"").slice(0,40))}</td>
      <td class="mut">${v.d||""}</td><td><span class="tag ${PLAT_CLS[v.plat]||""}">${v.plat.replace("号","")}</span></td>
      <td class="l" style="max-width:130px;overflow:hidden;text-overflow:ellipsis">${esc(v.acc)}</td>
      <td>${fmt(v.p)}</td><td>${fmt(v.e)}</td>
      <td>${m.完播率!=null?pct(m.完播率):"—"}</td><td>${m["5s完播"]!=null?pct(m["5s完播"]):"—"}</td>
      <td>${m["2s跳出"]!=null?pct(m["2s跳出"]):"—"}</td><td>${(m["封面点击"]!=null&&v.plat==="小红书")?pct(m["封面点击"]):"—"}</td>
      <td>${m.均时长!=null?Math.round(m.均时长):"—"}</td><td>${m.增粉!=null?(m.增粉>0?"+"+Math.round(m.增粉):Math.round(m.增粉)):"—"}</td>
    </tr>`;}).join("");
  $("#vPager").innerHTML=`<button class="btn" onclick="pageGo(-1)" ${state.page<=0?"disabled":""}>上一页</button>
    <span>${total?state.page*state.pageSize+1:0}-${Math.min((state.page+1)*state.pageSize,total)} / ${total.toLocaleString()}</span>
    <button class="btn" onclick="pageGo(1)" ${state.page>=pages-1?"disabled":""}>下一页</button>`;
}
function pageGo(d){state.page=Math.max(0,state.page+d);renderVideos();}
function exportCsv(){
  const vs=filteredVids();
  const head="标题,日期,平台,账号,播放,互动,完播率,5s完播,2s跳出,封面点击率,均时长,涨粉";
  const lines=vs.map(v=>{const m=v.m||{};return [v.t,v.d,v.plat,v.acc,v.p,v.e,
    m.完播率!=null?(m.完播率*100).toFixed(2)+"%":"",m["5s完播"]!=null?(m["5s完播"]*100).toFixed(2)+"%":"",
    m["2s跳出"]!=null?(m["2s跳出"]*100).toFixed(2)+"%":"",m["封面点击"]!=null?(m["封面点击"]*100).toFixed(2)+"%":"",
    m.均时长??"",m.增粉??""].map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",");});
  const blob=new Blob(["\uFEFF"+head+"\n"+lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`videos_${state.from}_${state.to}.csv`;a.click();
}

/* ================= 抽屉 ================= */
let drChart=null, drFansChart=null;
function openDrawer(key){
  const a=ACCOUNTS.find(x=>x.key===key);if(!a)return;
  $("#drName").innerHTML=`<span class="namecell">${avatarHTML(a,28)}<span>${esc(a.name)}</span></span>`;$("#drPlat").textContent=a.platform;$("#drPlat").className="tag "+(PLAT_CLS[a.platform]||"");
  const vs=(VIDEOS[key]||[]).filter(v=>inRange(v.d));
  const pub=vs.length,play=sumPlay(vs),eng=sumEng(vs);
  const fd=fansDelta(a);
  $("#drBody").innerHTML=`
    <div class="minikpis">
      ${[["粉丝",fmt(a.fans)],["窗口发布",pub],["窗口播放",fmt(play)],["窗口互动",fmt(eng)]].map(([l,v])=>
        `<div class="kpi"><div class="v" style="font-size:22px">${v}</div><div class="l">${l}</div></div>`).join("")}
    </div>
    <div class="card" id="drFansCard" style="padding:14px 16px"><h3 style="font-size:14px">粉丝走势</h3><div id="drFans" style="height:180px"></div></div>
    <div class="card" style="padding:14px 16px"><h3 style="font-size:14px">每日发布 / 播放</h3><div id="drChart" style="height:220px"></div></div>
    <div class="card" style="padding:14px 16px"><h3 style="font-size:14px">窗口内视频（${vs.length}）</h3>
      <table><tr><th class="l">标题</th><th>日期</th><th>播放</th><th>互动</th><th>完播</th><th>涨粉</th></tr>
      ${vs.slice(0,120).map(v=>{const m=v.m||{};return `<tr><td class="l" style="max-width:360px;overflow:hidden;text-overflow:ellipsis">${esc((v.t||"").slice(0,36))}</td>
        <td class="mut">${v.d||""}</td><td>${fmt(v.p)}</td><td>${fmt(v.e)}</td>
        <td>${m.完播率!=null?pct(m.完播率):"—"}</td><td>${m.增粉!=null?Math.round(m.增粉):"—"}</td></tr>`;}).join("")}
      </table>${vs.length>120?'<div class="mut" style="font-size:12px;margin-top:6px">仅显示前 120 条</div>':""}
    </div>`;
  $("#drawer").classList.add("open");
  setTimeout(()=>{const el=$("#drChart");if(!el||!window.echarts)return;
    if(drChart){drChart.dispose();}
    drChart=echarts.init(el);
    const byDay={};let d=state.from;let g=0;while(d<=state.to&&g++<4000){byDay[d]={pub:0,play:0};d=dayAdd(d,1);}
    vs.forEach(v=>{if(byDay[v.d]){byDay[v.d].pub++;byDay[v.d].play+=v.p||0;}});
    const days=Object.keys(byDay);
    drChart.setOption({tooltip:{trigger:"axis"},legend:{data:["发布条数","播放量"],right:6,top:0,textStyle:{color:"#5B564D"}},grid:{left:44,right:50,top:30,bottom:24},
      xAxis:{type:"category",data:days.map(x=>x.slice(5)),axisLabel:{color:"#948C7E",interval:Math.max(0,Math.floor(days.length/8))}},
      yAxis:[{type:"value",minInterval:1,axisLabel:{color:"#948C7E"},splitLine:{lineStyle:{color:"#F3EEE3"}}},{type:"value",axisLabel:{color:"#948C7E",formatter:v=>fmt(v)},splitLine:{show:false}}],
      series:[{type:"bar",name:"发布条数",data:days.map(x=>byDay[x].pub),itemStyle:{color:"#C9A96E"},barMaxWidth:22},
              {type:"line",name:"播放量",yAxisIndex:1,data:days.map(x=>byDay[x].play),smooth:true,itemStyle:{color:"#D6392F"},symbolSize:4}]},true);
    drChart.resize();
    // 粉丝走势（有历史才画）
    const fcard=$("#drFansCard"), fel=$("#drFans");
    const sers=SERIES[key]||{};
    const fpts=Object.keys(sers).filter(x=>sers[x].fans!=null&&x<=state.to).sort().map(x=>[x,sers[x].fans]);
    if(fpts.length>=2&&fel&&fcard){
      if(drFansChart){drFansChart.dispose();}
      drFansChart=echarts.init(fel);
      drFansChart.setOption({tooltip:{trigger:"axis"},grid:{left:56,right:20,top:20,bottom:24},
        xAxis:{type:"category",data:fpts.map(p=>p[0].slice(5)),axisLabel:{color:"#948C7E"}},
        yAxis:{type:"value",scale:true,axisLabel:{color:"#948C7E",formatter:v=>fmt(v)},splitLine:{lineStyle:{color:"#F3EEE3"}}},
        series:[{type:"line",data:fpts.map(p=>p[1]),smooth:true,itemStyle:{color:"#C9A96E"},areaStyle:{opacity:.08},symbolSize:4}]},true);
      drFansChart.resize();
    } else if(fcard){fcard.style.display="none";}
  },80);
}
function closeDrawer(){$("#drawer").classList.remove("open");}

/* ================= YouTube ================= */
function renderYt(){
  if(!YT)return;
  const chs=YT.channels||[];
  const totSubs=chs.reduce((s,c)=>s+(c.subs||0),0);
  $("#ytKpis").innerHTML=[["v",chs.length,"频道",""],["v",fmt(totSubs),"订阅合计",""],["v",fmt(chs.reduce((s,c)=>s+(c.views||0),0)),"累计播放",""],["v",fmt(chs.reduce((s,c)=>s+(c.videos||0),0)),"视频总数",""]]
    .map(([cls,v,l])=>`<div class="kpi"><div class="${cls}">${v}</div><div class="l">${l}</div></div>`).join("");
  $("#ytTbl").innerHTML=`<tr><th class="l">频道</th><th>订阅</th><th>累计播放</th><th>视频数</th><th>数据日期</th></tr>`+
    chs.map(c=>`<tr><td class="l"><b>${esc(c.title)}</b> <span class="mut">${esc(c.handle||"")}</span></td><td>${fmt(c.subs)}</td><td>${fmt(c.views)}</td><td>${c.videos||"—"}</td><td class="mut">${c.asof||""}</td></tr>`).join("");
  drawYtChart();
}
let ytChart=null;
function drawYtChart(){
  if(!YT||!window.echarts)return;
  const hist=YT.history||{};const chs=YT.channels||[];
  const days=[...new Set(Object.values(hist).flat().map(r=>r.date))].sort();
  const colors=["#C9A96E","#D6392F","#1E9E5A","#4A7EBB","#8E6AA8"];
  const series=chs.map((c,i)=>{const mp={};(hist[c.id]||[]).forEach(r=>mp[r.date]=r.subs);
    return{name:c.title,type:"line",smooth:true,symbolSize:4,itemStyle:{color:colors[i%5]},
      data:days.map(d=>mp[d]??null)};});
  if(!ytChart)ytChart=echarts.init($("#ytChart"));
  ytChart.setOption({tooltip:{trigger:"axis"},legend:{right:8,textStyle:{color:"#5B564D"}},
    grid:{left:56,right:20,top:44,bottom:26},
    xAxis:{type:"category",data:days.map(x=>x.slice(5))},yAxis:{type:"value",axisLabel:{color:"#948C7E",formatter:v=>fmt(v)},splitLine:{lineStyle:{color:"#F3EEE3"}}},
    series},true);
  ytChart.resize();
}

/* ================= 启动 ================= */
function renderAll(){renderOverview();renderAccounts();renderVideos();renderYt();}
window.addEventListener("resize",()=>{ovChart&&ovChart.resize();ytChart&&ytChart.resize();drChart&&drChart.resize();drFansChart&&drFansChart.resize();});
boot().catch(e=>{document.getElementById("subline").textContent="数据加载失败: "+e;console.error(e);});
</script>
